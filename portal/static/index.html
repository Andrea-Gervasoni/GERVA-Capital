<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="andrea-token" content="{{ANDREA_TOKEN}}">
<meta name="color-scheme" content="light dark">
<title>GERVA Capital</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="aurora" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>

<header class="topbar">
  <nav class="lg nav" aria-label="Sezioni">
    <a class="brand" href="#/panoramica" aria-label="GERVA Capital, panoramica">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="16" r="15" class="logo-ring"/><path d="M22.5 11.2A8 8 0 1 0 24 17h-7.5" class="logo-g"/><circle cx="24.6" cy="9" r="2.4" class="logo-dot"/></svg>
      <span class="wordmark">GERVA <em>Capital</em></span>
    </a>
    <div class="tabs" id="tabs" role="tablist">
      <button data-go="panoramica">Panoramica</button>
      <button data-go="plancia">Plancia</button>
      <button data-go="persone">Azienda</button>
      <button data-go="idee">Idee</button>
      <button data-go="grafici">Mercati</button>
      <button data-go="segnali">Segnali</button>
      <button data-go="ricerca">Ricerca</button>
      <button data-go="posta">Posta <em id="mailn" class="count"></em></button>
      <button data-go="impostazioni" aria-label="Impostazioni">Impostazioni</button>
    </div>
    <div class="status">
      <span class="pill paper" title="Conto simulato: nessun soldo vero">Paper</span>
      <span class="pill" id="live-pill"><i class="dot"></i><span id="live-txt">—</span></span>
      <button class="pill theme" id="theme" aria-label="Cambia tema chiaro/scuro" title="Tema chiaro o scuro"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2v16a8 8 0 0 1 0-16z"/></svg></button>
    </div>
  </nav>
</header>

<div id="banner-demo" class="banner hidden">Demo: database di prova, mercato sintetico, nessun dato reale.</div>
<div id="banner-sim" class="banner hidden">Simulazione: nessuna chiave API, gli agenti rispondono in modo prudente e finto (costo zero).</div>

<main class="view">
  <div class="subnav" id="subnav" role="tablist"></div>
  <div id="tip" class="hidden"></div>
  <h1 id="pnl-title" class="page-title"></h1>
  <section id="pnl-body" class="page"></section>
  <section id="stage" class="office hidden">
    <canvas id="office" tabindex="0" role="img" aria-label="Ufficio di GERVA Capital: le persone si muovono solo per eventi veri"></canvas>
    <div id="zoom"><button data-z="1.25" title="Avvicina">+</button><button data-z="0.8" title="Allontana">-</button><button data-z="fit" title="Tutto l'edificio">[ ]</button><span>rotella: zoom · trascina · clic su una persona</span></div>
  </section>
</main>

<form id="cmd" class="lg cmd" autocomplete="off">
  <label for="cmdtext">Parla al Capo</label>
  <input id="cmdtext" maxlength="2000" placeholder="Es. «Fammi un riepilogo del rischio di oggi»">
  <button class="btn primary">Invia</button>
</form>

<div id="toast" role="alert" hidden></div>
<div id="scrim" class="scrim hidden"></div>
<aside id="dialog" class="lg sheet hidden" role="dialog" aria-modal="true" aria-labelledby="dlg-head">
  <div class="sheet-head"><div id="dlg-head" class="who"></div><button class="x" data-close="dialog" aria-label="Chiudi la scheda">✕</button></div>
  <div class="seg" id="dlg-tabs"></div>
  <div class="sheet-body" id="dlg-body"></div>
</aside>

<script src="/static/gfx.js"></script>
<script src="/static/world.js"></script>
<script src="/static/sim.js"></script>
<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
