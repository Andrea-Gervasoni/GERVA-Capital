# Valori iniziali delle impostazioni. Li cambia SOLO Andrea dal pannello Impostazioni del portale:
# le modifiche vanno nella tabella `settings` (e nell'audit log), questo file resta il default.

budget:
  daily_eur: 4.00            # tetto giornaliero degli agenti (6/11: era 0,60; la spesa reale e' di pochi centesimi)
  total_eur: 20.0            # crediti Anthropic oggi: circa 20,7 EUR (23,11 USD)
  downgrade_at: 0.80         # oltre l'80% del tetto giornaliero il Governor scala i modelli verso il basso
  alert_days_left: 7         # sotto 7 giorni di autonomia il Capo bussa ad Andrea (grande richiesta n.3)
  usd_eur: 0.894             # cambio per convertire i prezzi in USD (EURUSD 1,1183 in GERVA-Q state/ al 30/10/2026)
  per_dept_daily_eur_map:    # tetti per reparto (somma > daily_eur di proposito: e' il tetto globale a vincolare)
    direzione: 0.60
    rischio: 0.30
    ricerca: 0.60
    validazione: 0.45
    redazione: 0.50
    pod: 0.60
    talent: 0.10
    lungo: 0.25               # Comitato di lungo periodo (Head + due analisti)

firm:
  strike: false              # Sciopero: agenti fermi, codice deterministico attivo
  mode: paper                # unico valore ammesso: paper (LIVE e' bloccato)
  heartbeat_minutes: 15

crypto:
  eseguibile: false          # IBKR paper rifiuta le crypto (6/11: 'calcolo del margine non disponibile'): sul conto IBKR non si eseguono
  venue: none                # 'alpaca' = le crypto si eseguono sul conto PAPER di Alpaca, 24 ore su 24 (servono le chiavi paper in .env)
  venue_max_frac: 0.60       # al massimo il 60% del valore del conto Alpaca in crypto
  venue_mirror_model: true   # la sede replica anche il modello crypto di GERVA-Q (oltre ai segnali accettati)
  venue_min_trade_usd: 25.0  # ordini sotto 25 dollari non si inviano

signals:                    # sala segnali crypto: gli agenti analizzano, il codice limita
  risk_frac: 0.005           # si rischia al massimo lo 0,5% del conto per segnale (dimensione = rischio / distanza dello stop)
  max_frac: 0.03             # al massimo il 3% del conto su un segnale
  max_total_frac: 0.10       # al massimo il 10% del conto su tutti i segnali insieme
  telegram_execute: true      # i segnali che arrivano da Telegram possono entrare nel conto (analisi, veto e tetti permettendo); false = solo si seguono
  telegram_max_per_hour: 10   # al massimo 10 segnali all'ora dalle sale: oltre si ignorano (anti-spam, anti-manipolazione)
  ttl_days: 7                # un segnale non raggiunto in 7 giorni scade

expectations:               # aspettative del fondo: il caso realistico riduce il rendimento storico
  haircut: 0.5               # si tiene il 50% del rendimento medio storico (sopravvivenza, sovradattamento)
  costs_year: 0.015          # costi di esecuzione e commissioni, 1,5% l'anno

desk:                        # desk di trading: gli agenti propongono, il codice valida, GERVA-Q esegue
  enabled: true
  max_name_frac: 0.05        # al massimo il 5% del NAV su un titolo
  max_total_frac: 0.30       # al massimo il 30% del NAV in totale su tutti i desk

volmgmt:                   # leva gestita per volatilita' (prova con: firm.py volgest)
  enabled: false             # false = GERVA-Q usa la leva fissa; true = la leva segue la volatilita' recente
  lo: 0.6                    # moltiplicatore minimo (mercato agitato)
  hi: 1.4                    # moltiplicatore massimo (mercato calmo)

pace:                      # ritmo di ingresso: quanto puo' COMPRARE GERVA-Q in un giorno; lo decide una riunione, senza massimi del codice
  enabled: true
  meeting_every_days: 7      # la riunione si rifa' ogni 7 giorni, o appena cambia la fascia di volatilita' del mercato

ideas:                     # ogni agente cerca idee e le presenta al superiore; il comitato approva; i fatti decidono il premio
  enabled: true
  agents_per_day: 3          # quanti agenti (a rotazione) cercano un'idea ogni giorno (ogni giro costa: Opus)
  max_per_agent_week: 2
  committee_per_day: 2
  max_name_frac: 0.03        # al massimo il 3% del conto su una singola idea
  max_total_frac: 0.15       # al massimo il 15% del conto su tutte le idee aperte
  horizon_days: 20
  share_up: 0.15             # quota del bonus che va a ogni superiore che l'ha portata su

rules:                       # regole votate dal comitato (dentro la Costituzione: firm/rules.py)
  enabled: true
  cooldown_days: 0           # 0 = nessuna pausa: una regola si puo' riportare in consiglio quando si vuole
  max_per_day: 0             # 0 = nessun limite
  review_days: 14            # ogni regola torna in consiglio per essere riconfermata o lasciata decadere

free:                      # banco libero: gli agenti aprono e chiudono trade quando vogliono sul conto paper di Alpaca; nessuna regola finche' non la votano
  enabled: true
  cycle_minutes: 30          # ogni quanti minuti gli agenti sono chiamati a decidere (costo: Opus). Lo decidono loro con una regola
  agents_per_cycle: 1
  max_intents: 20            # trade per chiamata (puo' essere tanti: la chiusura e' del codice, non serve richiamare l'agente)
  monitor_seconds: 15        # ogni quanto il codice controlla stop, obiettivi e tempi di chiusura
  riesame_loss_frac: 0.03    # una perdita di giornata oltre il 3% convoca il riesame (non e' un limite: serve a far parlare)

release:
  any_day: true               # scelta di Andrea del 6/11: i rilasci di GERVA-Q si applicano quando serve (sempre backup, changelog e audit)
  weekday: 6                 # 0 = lunedi' ... 6 = domenica (REGOLE_SFIDA regola 7)
  start_hour_utc: 8
  end_hour_utc: 20

models:
  by_grade_map:              # livello di modello per grado (la promozione cambia il livello)
    "0": claude-opus-5-5    # Stagista
    "1": claude-opus-5-5    # Analista
    "2": claude-opus-5-5    # Analista Senior
    "3": claude-opus-5-5   # Ricercatore
    "4": claude-opus-5-5   # Senior
    "5": claude-opus-5-5   # Manager
    "6": claude-opus-5-5   # Head
  ceo_committee: claude-opus-5-5
  deep_validation: claude-opus-5-5

gate:                        # cancello automatico prima della Validazione (DECISIONS D3)
  dsr_min: 0.95
  pbo_max: 0.30
  min_years: 3.0

pods:
  enabled: false             # i pod sono spenti (scelta di Andrea del 6/11): si opera solo sul conto
  initial_capital_frac: 0.0
  dd_cut: 0.05               # drawdown del pod: capitale dimezzato
  dd_close: 0.075            # drawdown del pod: pod chiuso
  capital_tax_annual: 0.02   # tassa sul capitale usato (costo opportunita')
  max_corr: 0.5

economy:
  gc_per_eur: 100            # 1 GC = 1 centesimo di budget reale
  bonus_share: 0.10          # quota dell'alpha netto positivo che diventa bonus pool
  head_share: 0.25           # parte del bonus al Capo Pod
  prior_alpha_sd_annual: 0.05
  min_days_for_realloc: 60
  max_monthly_shift: 0.02

talent:
  min_evals_promotion: 30
  probation_days: 14
  p_value: 0.05
