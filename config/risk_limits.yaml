# LIMITI DI RISCHIO — li imposta Andrea dal pannello Impostazioni, non gli agenti.
# Il motore di rischio (firm/risk.py) e il Gateway (firm/gateway.py) li leggono in sola lettura.
# Valori iniziali prudenti; motivazioni in docs/research/risk_and_execution.md §1.

order:
  max_notional_frac_nav: 0.10      # fat-finger: nessun ordine sopra il 10% del NAV (6/11: era 5%)
  max_price_deviation: 0.02        # prezzo di riferimento entro +-2% dall'ultimo prezzo noto
  min_notional_eur: 50

pod:
  max_capital_frac: 0.05           # capitale massimo per pod (frazione del NAV)
  max_gross: 2.0                   # leva ammessa (6/11)
  allow_short: true
  max_position_frac: 0.25          # concentrazione: max 25% del capitale del pod per strumento
  dd_cut: 0.05
  dd_close: 0.075

firm:
  max_gross: 2.0                   # LEVA fino a 2x il NAV (6/11, scelta di Andrea; era 1.0)
  kill_drawdown: 0.35              # KILL automatico: unico freno che resta (6/11: era 0.15; col 1,5x il backtest ha max DD -34%)
  max_crypto_frac: 0.60            # esposizione crypto per controparte
  max_pod_correlation: 0.5

instruments:
  allowed_kinds: [etf_ucits, etf_us, stock, etc, crypto, option, future, cfd, forex_speculative]   # 6/11: tutti
  crypto_allowed: [BTC, ETH, SOL, XRP, ADA, DOGE, LTC, LINK, AVAX, BCH, SUI]
  forbidden_kinds: []

hours_utc:                         # orari ammessi per l'invio al broker paper
  stock: [13, 21]
  etf_ucits: [7, 16]
  crypto: [0, 24]
