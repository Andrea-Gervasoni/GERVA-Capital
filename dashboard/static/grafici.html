<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<title>GERVA Capital · Galleria tecnica dei grafici</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/glass.css">
<script src="js/theme-init.js"></script>
<script type="module" src="js/gallery.js"></script>
</head>
<body data-level="esperto">
<div class="aurora" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i><i class="a4"></i><i class="a5"></i><i class="a6"></i></div>
<svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true" focusable="false">
  <linearGradient id="g-area-fund" x1="0" y1="0" x2="0" y2="1"><stop class="g-stop g-stop--fund-a" offset="0"/><stop class="g-stop g-stop--fund-b" offset="1"/></linearGradient>
  <linearGradient id="g-area-dd" x1="0" y1="0" x2="0" y2="1"><stop class="g-stop g-stop--dd-b" offset="0"/><stop class="g-stop g-stop--dd-a" offset="1"/></linearGradient>
</svg>
<main class="gallery" id="gallery">
  <header class="gallery__head">
    <h1 class="gallery__title">Galleria tecnica dei grafici</h1>
    <p class="gallery__note">Banco di prova del motore dei grafici: non è una pagina del prodotto. Tutti i dati sono ESEMPI o SIMULATI. Lo stile arriva solo dai token <code>--chart-*</code>.</p>
    <button class="btn btn--sm btn--ghost" type="button" id="gallery-theme">Cambia tema</button>
    <a class="btn btn--sm btn--ghost" href="./">Torna alla dashboard</a>
  </header>
  <div id="gallery-body"></div>
</main>
<div class="tooltip" id="tooltip" role="presentation" hidden></div>
</body>
</html>
